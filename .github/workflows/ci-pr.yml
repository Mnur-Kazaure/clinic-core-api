name: PR CI

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "app/**"
      - "clinic-app/**"
      - "alembic/**"
      - ".github/workflows/ci-pr.yml"
      - "requirements.txt"
      - "pnpm-lock.yaml"
      - "clinic-app/package.json"

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-pr-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest email-validator

      - name: Compile backend modules
        run: python -m compileall app

      - name: Run backend contract tests (fast gate)
        run: |
          python -m pytest app/tests/test_lab_workflow_contract.py -q
          python -m pytest app/tests/test_billing_lab_payment_gate.py -q

  frontend-pr-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: clinic-app
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: clinic-app
        run: pnpm build

